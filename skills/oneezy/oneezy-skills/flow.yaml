skill: oneezy-skills
purpose: Keep Justin's skills in sync from the library by running the published sync tool through the script beside the skill; land updates, downgrades, adds and playground changes in the library as a release, link them, and run oneezy-migrate.
runtime: [npx (Node 20+), git, gh]
refs:
  - token: scripts/sync.ps1
    kind: file
    id: skills/oneezy/oneezy-skills/scripts/sync.ps1
    need: conditional
    when: Windows
  - token: scripts/sync.sh
    kind: file
    id: skills/oneezy/oneezy-skills/scripts/sync.sh
    need: conditional
    when: Linux, macOS, WSL, cloud
  - token: skills-sync.json
    kind: file
    id: skills-sync.json
    need: conditional
    when: change (a hold is written or cleared), add of a declared source, promote (the plugin description), a skill reported gone upstream
  - token: .github/workflows/land.yml
    kind: file
    id: .github/workflows/land.yml
    need: conditional
    when: every change to the library; it lands a pushed land/* branch in dev and main and starts the release
  - token: docs/agents/references.md
    kind: file
    id: docs/agents/references.md
    need: conditional
    when: playground create; the flow.yaml shape
  - token: /oneezy-migrate
    kind: skill
    id: oneezy-migrate
    need: required
    when: after every landed change, with the update report
  - token: /unslop
    kind: skill
    id: unslop
    need: example
    when: the source's own copy stays when a skill is copied to the playground
unresolved:
  - token: "@oneezy/skills-sync"
    note: the npm package name of the published sync tool; not a plugin or app
  - token: "/play:<name>"
    note: the plugin form of a playground skill; a pattern, not one skill
  - token: /play-<name>
    note: the name pattern of every playground skill, not one skill
  - token: /play-unslop
    note: an example of a playground skill's name; it exists only once Justin copies unslop to the playground
agents:
  max: 0
steps:
  - id: map-request
    does: match Justin's words to a plain run of the script (none for sync, my skills are missing or nothing; versions <source>; status; unlink; --plan), or to change (update, upgrade, downgrade, all or one source, --to a version, previous or latest), add (owner/repo or a link to one skill) or playground (copy, create, remove, promote)
    outcome:
      done: arguments chosen, or change, add or playground
  - id: run-script
    after: map-request
    if: a plain run
    does: run scripts/sync.ps1 on Windows or scripts/sync.sh elsewhere; one call to npx --yes @oneezy/skills-sync@latest (no arguments is a quiet sync that pulls the library and installs the committed lock exactly, moving nothing upstream, then links every skill into the user folders)
    needs: [npx, git]
    outcome:
      done: the tool's output on screen (nothing when a quiet sync changed nothing)
  - id: clone
    after: map-request
    if: change, add or playground
    does: clone oneezy/skills at dev into a temporary folder on branch land/<topic>, never the library this machine syncs from
    needs: [git]
    outcome:
      done: a clean clone on land/<topic>
  - id: change-sources
    after: clone
    if: change
    does: run the script with update [<source>] [--to <version>|previous|latest] --json --repo . and keep the report; apply its config entries to skills-sync.json (set sources.<id>.version, or remove it for null)
    needs: [npx, git]
    outcome:
      done: the lock and snapshots moved, the hold written or cleared
      fail: refused (not a release) → the versions it names, stop
  - id: add-source
    after: clone
    if: add
    does: name the source (owner/repo, or owner/repo#ref with --root and --skills for a link to one skill; an already declared source gets its skills list edited and update <source> instead); run the script with add <source> --repo .
    needs: [npx, git]
    outcome:
      done: the source and its plugin declared
      fail: the tool refuses the source → its error line, stop
  - id: playground
    after: clone
    if: playground
    does: copy (a skill folder from its repo into skills/play/play-<name>, frontmatter name set, origin-repo, origin-path and origin-commit in metadata), create (a new play-<name> skill with flow.yaml), remove (delete skills/play/play-<name>) or promote (git mv to skills/oneezy/oneezy-<name> or skills/trident/trident-<name> unless Justin names it, rename frontmatter, flow and tokens, add it to the plugin description)
    needs: [git]
    outcome:
      done: the skill folder written, removed or moved
  - id: build-check
    after: [change-sources, add-source, playground]
    does: run the script with build --repo . then check --repo .
    needs: [npx]
    outcome:
      done: check exits 0
      fail: nothing changed in the clone → report there is nothing to land, stop
  - id: land-release
    after: build-check
    does: commit and push land/<topic>; the land workflow checks it, squashes it into dev, promotes main and starts the release, so the session merges nothing; watch its run and the release run over gh api REST
    needs: [git, gh]
    outcome:
      done: releases/latest is a new release-<n>
      fail: the land run is red → its failing step, stop (nothing landed); push refused for lack of access to oneezy/skills → one line naming a session that has it, stop
  - id: link-new
    after: land-release
    does: run the script with --pull --quiet, so the release is linked on this machine now, then delete the temporary folder
    needs: [npx, git]
    outcome:
      done: the new state linked
  - id: migrate
    after: link-new
    calls: { skill: oneezy-migrate }
    does: run oneezy-migrate with the update report (or none after an add or a playground change)
    outcome:
      done: its report, usually nothing to migrate
  - id: report
    after: [run-script, migrate]
    does: one line per change the tool printed, then its summary line; for a change each moved source's old and new version and the changelog's headings and breaking lines; the release tag; then the oneezy-migrate report; say plainly when a skill is reported gone upstream and when something was left alone as a conflict
    returns: the change lines, versions, release tag and migrate report
    outcome:
      done: report on screen
      fail: a skill Justin asked for is still missing after the sync → say which and stop; the fix belongs in the library
