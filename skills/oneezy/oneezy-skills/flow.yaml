skill: oneezy-skills
purpose: Keep Justin's skills in sync from the library by running the published sync tool through the script beside the skill, then report what it printed.
runtime: [npx (Node 20+), git]
refs:
  - token: scripts/sync.ps1
    kind: file
    id: skills/oneezy/oneezy-skills/scripts/sync.ps1
    need: conditional
    when: Windows
  - token: scripts/sync.sh
    kind: file
    id: skills/oneezy/oneezy-skills/scripts/sync.sh
    need: conditional
    when: Linux, macOS, WSL, cloud
  - token: skills-sync.json
    kind: file
    id: skills-sync.json
    need: mention
    when: a skill is reported gone upstream; the fix the tool names edits the config
unresolved:
  - token: "@oneezy/skills-sync"
    note: the npm package name of the sync tool, written as a command argument; not a plugin or app
agents:
  max: 0
steps:
  - id: map-request
    does: match Justin's words to the script's arguments (none for sync, update or my skills are missing; add <owner/repo>; update; status; unlink; --plan)
    outcome:
      done: arguments chosen
  - id: run-script
    after: map-request
    does: run scripts/sync.ps1 on Windows or scripts/sync.sh elsewhere; each is one call to npx --yes @oneezy/skills-sync with the arguments mapped (none → --quiet; add <owner/repo> → add <owner/repo> --quiet; update → refresh --quiet; status, unlink and --plan as they are); a first run on a machine clones the library into ~/.skills-sync; a sync pulls it, moves third-party skills to upstream's tip when a pull is due, rebuilds the layers and links the user folders; add and refresh write the library only
    needs: [npx, git]
    outcome:
      done: the tool's output on screen (nothing when a quiet run changed nothing)
      fail: the tool exits non-zero → report its failed lines and stop
  - id: link-new
    after: run-script
    if: add or update changed the library
    does: run the script again with no arguments, so the skills add or refresh brought into the library are linked into the user folders
    needs: [npx, git]
    outcome:
      done: the new skills linked
  - id: report
    after: [run-script, link-new]
    does: one line per change the tool printed, then its summary line; say plainly when a skill is reported gone upstream (the tool names the fix) or left alone as a conflict
    returns: the change lines and the summary
    outcome:
      done: report on screen
      fail: a skill Justin asked for is still missing after the sync → say which and stop; the fix belongs in the library
