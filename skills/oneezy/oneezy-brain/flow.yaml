skill: oneezy-brain
purpose: Resolve Justin's Drive Brain and capture, read, triage, update or ingest through its current contract.
runtime: [Google Drive, Google Sheets, Google Docs, node]
refs:
  - token: references/location.md
    kind: file
    id: skills/oneezy/oneezy-brain/references/location.md
    need: required
    when: every request
  - token: references/operations.md
    kind: file
    id: skills/oneezy/oneezy-brain/references/operations.md
    need: conditional
    when: reading an agenda or writing a record
  - token: references/ingestion.md
    kind: file
    id: skills/oneezy/oneezy-brain/references/ingestion.md
    need: conditional
    when: source collection
  - token: scripts/drive-plan.mjs
    kind: file
    id: skills/oneezy/oneezy-brain/scripts/drive-plan.mjs
    need: conditional
    when: planning native Sheets requests
  - token: scripts/brain.py
    kind: file
    id: skills/oneezy/oneezy-brain/scripts/brain.py
    need: mention
    when: explicit historical read only
  - token: /oneezy-status
    kind: skill
    id: oneezy-status
    need: conditional
    when: Brain daily brief
  - token: /oneezy-meeting
    kind: skill
    id: oneezy-meeting
    need: conditional
    when: requested meeting format
unresolved: []
agents:
  max: 0
steps:
  - id: resolve
    does: read private registry, resolve account and verify live List and Schema
    needs: [references/location.md]
    outcome:
      done: current Drive authority verified
      fail: missing route or schema mismatch reported
  - id: operate
    after: resolve
    does: exact-ID and source/meaning lookup; apply the authorized read or guarded write
    needs: [references/operations.md]
    outcome:
      done: one canonical record or context subject
      fail: conflict or missing evidence reported without overwrite
  - id: verify
    after: operate
    does: read back by immutable ID and verify one writable location; report actual links and coverage
    outcome:
      done: verified result and rollout limits reported
