skill: oneezy-skills
purpose: Keep Justin's skills in sync from the library by running the published sync tool through the script beside the skill, and land an add in the library as a release, then report what it printed.
runtime: [npx (Node 20+), git, gh]
refs:
  - token: scripts/sync.ps1
    kind: file
    id: skills/oneezy/oneezy-skills/scripts/sync.ps1
    need: conditional
    when: Windows
  - token: scripts/sync.sh
    kind: file
    id: skills/oneezy/oneezy-skills/scripts/sync.sh
    need: conditional
    when: Linux, macOS, WSL, cloud
  - token: skills-sync.json
    kind: file
    id: skills-sync.json
    need: mention
    when: a skill is reported gone upstream; the fix the tool names edits the config
  - token: .github/workflows/land.yml
    kind: file
    id: .github/workflows/land.yml
    need: conditional
    when: add; it lands a pushed land/* branch in dev and main and starts the release
unresolved:
  - token: "@oneezy/skills-sync"
    note: the npm package name of the published sync tool; not a plugin or app
agents:
  max: 0
steps:
  - id: map-request
    does: match Justin's words to the script's arguments (none for sync, update, my skills are missing or nothing; update for third-party skills to upstream; status; unlink; --plan), or to the add steps for add <owner/repo> or a link to one skill
    outcome:
      done: arguments chosen, or add
  - id: run-script
    after: map-request
    if: not an add
    does: run scripts/sync.ps1 on Windows or scripts/sync.sh elsewhere; one call to npx --yes @oneezy/skills-sync@latest with Justin's words mapped to its arguments (no arguments is a quiet sync, which clones the library into ~/.skills-sync on a machine's first run, pulls it, moves unpinned third-party skills to upstream's tip when a pull is due, rebuilds the layers and links every skill into the user folders; update is the tool's refresh; status, unlink and --plan pass through as they are); no WSL fan-out here, that happens only when Justin runs the tool himself without --quiet
    needs: [npx, git]
    outcome:
      done: the tool's output on screen (nothing when a quiet sync changed nothing)
  - id: add-source
    after: map-request
    if: an add
    does: name the source (owner/repo, or owner/repo#ref with --root and --skills for a link to one skill; an already declared source gets its skills list edited instead); clone oneezy/skills at dev into a temporary folder on branch land/add-<id>, never the library this machine syncs from; there run the script with add <source> --repo ., then build --repo ., then check --repo .
    needs: [npx, git]
    outcome:
      done: check exits 0 and the new plugin is under plugins/
      fail: the tool refuses the source → its error line, stop
  - id: land-release
    after: add-source
    does: commit and push land/add-<id>; the land workflow checks it, squashes it into dev, promotes main and starts the release, so the session merges nothing; watch its run and the release run over gh api REST
    needs: [git, gh]
    outcome:
      done: releases/latest is a new release-<n>
      fail: the land run is red → its failing step, stop (nothing landed); push refused for lack of access to oneezy/skills → one line naming a session that has it, stop
  - id: link-new
    after: land-release
    does: run the script with --pull --quiet, so the release is linked on this machine now, then delete the temporary folder
    needs: [npx, git]
    outcome:
      done: the new skills linked
  - id: report
    after: [run-script, link-new]
    does: one line per change the tool printed, then its summary line, after the release tag for an add; say plainly when a skill is reported gone upstream (the tool names the fix, deselect it in skills-sync.json or keep a copy under skills/ as an own skill) and when something was left alone as a conflict
    returns: the change lines and the summary
    outcome:
      done: report on screen
      fail: a skill Justin asked for is still missing after the sync → say which and stop; the fix belongs in the library
