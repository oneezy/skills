# library: CI for the skills library. It checks every change, and cuts a release for every `main` commit that changes
# a package. It never pushes to dev or main (land.yml does, for land/* branches), and nothing here is a git hook (oneezy/skills#27, decisions 5 and A; ticket
# #30; releases: #48). Before committing, run `npx @oneezy/skills-sync check` yourself; this workflow is what catches a
# skipped one.
#
#   check    every pull request, and every push to dev and main. Checks out oneezy/tools at SKILLS_SYNC_REF,
#            builds @oneezy/skills-sync (found by the name in its package.json, never by folder) and runs it
#            against this checkout: `refresh --frozen` (every third-party skill at the commit skills-sync.lock.json
#            records), `build --check` (the committed plugins/ and catalogs match what the config, the lock and
#            skills/ produce), `check` (frontmatter, flow.yaml, generated-file drift), then `claude plugin
#            validate` on every committed package and on the catalog when the Claude Code CLI installs, and the release
#            script's own tests. The default shallow checkout is enough: none of them needs the library's history.
#   release  every push to main, after check passes on that commit; and a workflow_dispatch with job=release on
#            main, which is how land.yml starts it (a GITHUB_TOKEN push to main starts no workflow). `build --artifacts` makes one archive per plugin,
#            .github/scripts/release.mjs writes release.json (source commit and tree, digests of the config and the
#            lock, the tool commit, per plugin its version, archive sha256 and every file's sha256) against the previous
#            release, and a GitHub release `release-<n>` is published with the archives and release.json. A commit
#            that changes no package (a promotion merge, a replay of the job) releases nothing; a plugin whose version
#            would go backwards fails the job and releases nothing. The release is created as a draft and published
#            once every asset is up, so a failed upload leaves no half release; a leftover draft is deleted and redone.
#            A published release is never edited or deleted here; the repository's release immutability setting
#            locks its assets and tag.
#   refresh  only when started by hand from the Actions tab (workflow_dispatch, job=refresh; no schedule, ever). `update`
#            moves every source the config does not hold at a `version` to the tip of its ref (a pinned skill stays
#            at its pin); when skills-sync.lock.json changed, a pull request to dev titled `chore(sources): update <ids>`
#            carries the lock, the rebuilt packages and a summary of each source's version and commit before and after.
#            Day to day, `/oneezy-skills` does the same per source through a land/* branch, with no review. That PR's own branch and the release tags are the only refs this workflow ever
#            writes. A changed package takes the next version after the one it carries (skills-sync 0.4.0, tools
#            #90), so no job needs the library's history.
#
# SKILLS_SYNC_REF is the oneezy/tools commit the tool is built from: `main` at 87d4f98, @oneezy/skills-sync 0.5.0
# as published to npm (tools #99: the per-source skills-sync.lock.json with upstream versions, a frozen sync,
# `update --to`, `versions`, the play group). land.yml pins the same commit. Re-pin both when the library needs a
# newer tool.
#
# Secret (optional): REFRESH_TOKEN, a fine-grained PAT for this repo with contents and pull requests read/write.
# A pull request opened with the default GITHUB_TOKEN does not start this workflow's own `check` job on itself
# (GitHub's rule for token-created PRs); with REFRESH_TOKEN it does. Without it, close and reopen the PR.
name: library

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      job:
        description: refresh (update every unheld source to upstream's tip, as a PR to dev) or release (cut a release from main; started by land.yml)
        type: choice
        options: [refresh, release]
        default: refresh

env:
  SKILLS_SYNC_REF: 87d4f9808fce492a1a1e0ad2c27a84b8bfde219d

permissions: {}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: library-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the library
        uses: actions/checkout@v5
        with:
          path: library
          persist-credentials: false

      - name: Build @oneezy/skills-sync at SKILLS_SYNC_REF
        id: tool
        uses: ./library/.github/actions/skills-sync-cli
        with:
          ref: ${{ env.SKILLS_SYNC_REF }}

      - name: refresh --frozen
        env:
          CLI: ${{ steps.tool.outputs.cli }}
        run: node "$CLI" refresh --frozen --repo library

      - name: build --check
        env:
          CLI: ${{ steps.tool.outputs.cli }}
        run: node "$CLI" build --check --repo library

      - name: check
        env:
          CLI: ${{ steps.tool.outputs.cli }}
        run: node "$CLI" check --repo library

      - name: release script tests
        run: node --test library/.github/scripts/*.test.mjs

      - name: claude plugin validate
        env:
          # No account on the runner: validate reads files only, and a fresh config dir keeps it that way.
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: |
          shopt -s nullglob
          targets=(library/plugins/*/)
          if [[ -f library/.claude-plugin/marketplace.json ]]; then
            targets+=(library)
          fi
          if (( ${#targets[@]} == 0 )); then
            echo "::notice title=claude plugin validate::no committed packages under plugins/ and no catalog yet; nothing to validate"
            exit 0
          fi
          if ! npm install -g @anthropic-ai/claude-code > /dev/null 2>&1 || ! claude --version; then
            echo "::warning title=claude plugin validate skipped::the Claude Code CLI did not install on this runner"
            exit 0
          fi
          status=0
          for t in "${targets[@]}"; do
            t=${t%/}
            echo "::group::claude plugin validate $t"
            claude plugin validate "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.job == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: library-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out main at the pushed commit
        uses: actions/checkout@v5
        with:
          path: library
          persist-credentials: false

      - name: Build @oneezy/skills-sync at SKILLS_SYNC_REF
        id: tool
        uses: ./library/.github/actions/skills-sync-cli
        with:
          ref: ${{ env.SKILLS_SYNC_REF }}

      - name: refresh --frozen, then the archives
        env:
          CLI: ${{ steps.tool.outputs.cli }}
        run: |
          node "$CLI" refresh --frozen --repo library --quiet > /dev/null
          node "$CLI" build --artifacts --repo library --quiet

      - name: The previous release
        id: previous
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [[ -n "$tag" ]] && gh release download "$tag" --pattern release.json --dir "$RUNNER_TEMP/previous"; then
            echo "file=$RUNNER_TEMP/previous/release.json" >> "$GITHUB_OUTPUT"
            echo "previous release: $tag"
          else
            echo "no previous release"
          fi

      - name: The release record
        id: plan
        run: node library/.github/scripts/release.mjs library ${{ steps.previous.outputs.file && format('--previous "{0}"', steps.previous.outputs.file) || '' }} --tool-ref "$SKILLS_SYNC_REF" --repo "$GH_REPO"

      - name: Publish the release
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        working-directory: library
        run: |
          # a draft left by a failed run is not a release yet: delete it and start again
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file artifacts/release-notes.md artifacts/*.zip artifacts/release.json
          gh release edit "$TAG" --draft=false --latest
          echo "::notice title=released::$TAG at $GITHUB_SHA, $(gh release view "$TAG" --json url --jq .url)"

      - name: Nothing to release
        if: steps.plan.outputs.release != 'true'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: echo "::notice title=no release::$REASON"

  refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.job != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: library-refresh
    steps:
      - name: Check out dev
        uses: actions/checkout@v5
        with:
          ref: dev
          path: library
          # The whole history, for the pull request's branch; versions no longer need it (skills-sync 0.4.0).
          fetch-depth: 0

      - name: Build @oneezy/skills-sync at SKILLS_SYNC_REF
        id: tool
        uses: ./library/.github/actions/skills-sync-cli
        with:
          ref: ${{ env.SKILLS_SYNC_REF }}

      - name: update (every source not held at a version to upstream's tip)
        env:
          CLI: ${{ steps.tool.outputs.cli }}
        run: node "$CLI" update --repo library

      - name: build --plugins --catalogs (so the PR carries the rebuilt packages)
        env:
          CLI: ${{ steps.tool.outputs.cli }}
        run: node "$CLI" build --plugins --catalogs --repo library

      - name: What the lock says moved
        id: diff
        run: node library/.github/scripts/lock-diff.mjs library

      - name: Open the pull request to dev
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          path: library
          token: ${{ secrets.REFRESH_TOKEN || secrets.GITHUB_TOKEN }}
          base: dev
          branch: chore/sources-refresh
          branch-suffix: timestamp
          delete-branch: true
          commit-message: ${{ steps.diff.outputs.title }}
          title: ${{ steps.diff.outputs.title }}
          body: ${{ steps.diff.outputs.body }}

      - name: Nothing moved
        if: steps.diff.outputs.changed != 'true'
        run: echo "::notice title=refresh::every source is already where the config says; skills-sync.lock.json is unchanged and no pull request is opened"
