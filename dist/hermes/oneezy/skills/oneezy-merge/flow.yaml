skill: oneezy-merge
purpose: Land the current branch and end with one status report.
runtime: [git, gh, GitHub check runs, commit statuses]
refs:
  - token: /oneezy-status
    kind: skill
    id: oneezy-status
    need: required
    when: report
  - token: references/modes.md
    kind: file
    id: skills/oneezy/oneezy-merge/references/modes.md
    need: conditional
    when: the named operation/reference branch in SKILL.md
  - token: references/capabilities/contract.md
    kind: file
    id: skills/oneezy/oneezy-merge/references/capabilities/contract.md
    need: required
    when: before any dependency call
  - token: references/capabilities/chatgpt.md
    kind: file
    id: skills/oneezy/oneezy-merge/references/capabilities/chatgpt.md
    need: conditional
    when: ChatGPT host
  - token: references/capabilities/claude.md
    kind: file
    id: skills/oneezy/oneezy-merge/references/capabilities/claude.md
    need: conditional
    when: Claude host
  - token: references/capabilities/codex.md
    kind: file
    id: skills/oneezy/oneezy-merge/references/capabilities/codex.md
    need: conditional
    when: Codex host
  - token: references/capabilities/catalog.json
    kind: file
    id: skills/oneezy/oneezy-merge/references/capabilities/catalog.json
    need: conditional
    when: inventory, management or missing dependency
unresolved: []
agents:
  max: 0
steps:
  - id: mode
    does: read the arguments into open (no branch named), land (one branch named) or release (release, both, dev and main), and pick the PR base; a release from dev itself, or from a branch already landed, is promotion-only
    outcome:
      done: mode and base known
  - id: commit-push
    after: mode
    if: not a promotion-only release (mode is release and the current branch is dev itself or already landed)
    does: one shell call; stage the session's files, commit with a conventional subject carrying the ticket number and the attribution trailers, git push -u origin <branch>
    needs: [git]
    outcome:
      done: push accepted
      fail: push refused → one line, stop
  - id: open-pr
    after: commit-push
    if: not a promotion-only release
    does: one call against the base; the body holds Summary (Closes and at most five snapshot bullets), Evidence and Merge Danger
    needs: [gh]
    outcome:
      done: PR number returned
      fail: PR refused → one line, stop
  - id: wait-checks
    after: open-pr
    if: not a promotion-only release
    does: read the head commit's check runs (every Actions job and app check) and commit statuses (Vercel and other status apps)
    needs: [gh]
    loop:
      until: no check run is queued or in progress and no status is pending
      every: 90s
    outcome:
      done: every check run success, skipped or neutral and every status success; none at all after the first wait counts as green with nothing checked
      fail: any other conclusion or status → skip land and promote
  - id: land
    after: wait-checks
    if: mode is land or release, not a promotion-only release, and all checks green
    does: squash-merge with the expected head SHA, title = PR title plus (#<pr>); then one shell call; fetch, verify origin/<base> contains the squash, check out the base, fast-forward, delete the remote and local branch once; another session's worktree is never touched
    needs: [gh, git]
    outcome:
      done: base fast-forwarded, branch deleted
      fail: origin/<base> does not contain the squash → stop; a refused delete is left for the report, not retried
  - id: promote
    after: [mode, land]
    if: mode is release
    does: fast-forward main to dev on origin; when origin refuses, open a release PR dev → main, merge it with a merge commit, verify origin/main contains it; then fast-forward the local main ref, verify origin/dev is an ancestor of origin/main with an identical tree, and wait for the checks on main's new head (a release job among them) as in wait-checks
    needs: [git, gh]
    outcome:
      done: origin/main contains origin/dev, the trees are identical, main's checks are green (a merge-commit promotion never makes the two commits equal)
      fail: promotion refused, containment or tree differs, or main's checks red → one line, stop
  - id: report
    after: [wait-checks, land, promote]
    calls:
      skill: oneezy-status
    returns: the status report, the only message
    outcome:
      done: report on screen
